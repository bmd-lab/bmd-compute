name: bmd-compute

channels:
  - conda-forge

dependencies:
  - python=3.12
  - fastapi
  - uvicorn
  - jinja2
  - python-multipart
  - paramiko
  - pytest
  - pip
  # The scientific stack (atomate2, pymatgen, pymatgen-core, custodian,
  # emmet-core, jobflow, spglib and their pinned supporting packages) comes
  # only from the shared constraints file, which also defines the POWER
  # runtime. It is not listed again here so the two cannot drift.
  - pip:
      - -r constraints/scientific-runtime.txt
